name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - run: cargo build --locked --release --bins
      - run: cargo test --locked --workspace --all-targets
      - name: Start disposable loopback broker
        run: |
          docker run --detach --name broker -p 127.0.0.1:1883:1883 eclipse-mosquitto:2 \
            mosquitto -c /mosquitto-no-auth.conf
          timeout 30 bash -c 'until docker exec broker mosquitto_pub -h 127.0.0.1 -t ci/ready -m ready; do sleep 1; done'
      - name: Run broker-backed tests
        run: cargo test --locked --test bridge_roundtrip --test mqtt_broker --test mqtt_discovery -- --ignored --test-threads=1

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          arguments: --locked --all-features

  packaging:
    name: Compose service lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/packaging/test-compose.sh
